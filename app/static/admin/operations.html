<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Операции · Phantom</title><style>:root{--bg:#07050c;--panel:#120d1a;--line:#342445;--text:#fff;--muted:#a99bb9;--accent:#9d3cff;--green:#45d69b;--red:#ff7087;--yellow:#ffc766}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,rgba(157,60,255,.14),transparent 35%),var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.top h1{margin:0;font-size:26px}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#171020;color:#fff;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,#a33cff,#6929dc)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:linear-gradient(145deg,rgba(20,14,29,.98),rgba(12,9,18,.98));border:1px solid var(--line);border-radius:18px;padding:15px}.metric small{display:block;color:var(--muted);margin-bottom:7px}.metric b{font-size:25px}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--yellow)}.sections{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-top:12px}.section h2{margin:0 0 12px;font-size:17px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid rgba(52,36,69,.55)}.row:last-child{border:0}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:#24182f;font-size:11px}.pill.ok{background:rgba(69,214,155,.12)}.pill.bad{background:rgba(255,112,135,.12)}.bar{height:8px;background:#24182f;border-radius:999px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#7e2cdb,#b84cff)}.list{max-height:440px;overflow:auto}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.sections{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.top h1{font-size:22px}}</style></head><body><main class="wrap"><div class="top"><div><div class="muted">PHANTOM CONTROL CENTER</div><h1>Операции и здоровье системы</h1><div id="stamp" class="muted">Загрузка…</div></div><button id="refresh" class="btn primary">Обновить</button></div><div id="metrics" class="grid"></div><div class="sections"><section class="card section"><h2>Telegram и подключения</h2><div id="telegram"></div></section><section class="card section"><h2>Очередь и хранилище</h2><div id="infra"></div></section><section class="card section"><h2>Архив и медиа</h2><div id="archive"></div></section><section class="card section"><h2>Последние ошибки</h2><div id="failures" class="list"></div></section></div></main><script>const token=()=>sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';const bytes=n=>{n=Number(n||0);const u=['Б','КБ','МБ','ГБ','ТБ'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};async function api(){const r=await fetch('/api/admin/telegram/coverage',{headers:{Authorization:'Bearer '+token()},cache:'no-store'});if(r.status===401){location.href='/admin';throw Error('Требуется вход')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Ошибка запроса');return d}function metric(label,value,state=''){return `<section class="card metric"><small>${esc(label)}</small><b class="${state}">${esc(value)}</b></section>`}function row(label,value){return `<div class="row"><span>${esc(label)}</span><b>${value}</b></div>`}function render(d){stamp.textContent='Снимок: '+dt(d.generated_at);const queued=d.jobs?.statuses?.queued||0,failed=Object.values(d.unresolved_failed_updates||{}).reduce((a,b)=>a+b,0),unavailable=d.archive?.media_statuses?.unavailable||0;metrics.innerHTML=[metric('Webhook',d.webhook.ok?'Работает':'Ошибка',d.webhook.ok?'ok':'bad'),metric('Активных пользователей 24ч',d.users.active_24h),metric('Очередь',queued,queued?'warn':'ok'),metric('Нерешённых ошибок',failed,failed?'bad':'ok'),metric('Активных подключений',d.connections.active),metric('Групповых архивов',d.connections.groups_active),metric('Сообщений за 24ч',d.archive.messages_24h),metric('Недоступных медиа',unavailable,unavailable?'warn':'ok')].join('');const missing=(d.required_updates||[]).filter(x=>!(d.webhook.allowed_updates||[]).includes(x));telegram.innerHTML=row('Webhook URL',`<span class="mono">${esc(d.webhook.url||'—')}</span>`)+row('Telegram API latency',`${esc(d.webhook.latency_ms)} мс`)+row('Ожидают обработки',esc(d.webhook.pending_update_count??'—'))+row('Allowed updates',missing.length?`<span class="pill bad">Не хватает: ${esc(missing.join(', '))}</span>`:'<span class="pill ok">Полное покрытие</span>')+row('Ассистент-подключения',esc(d.connections.active-d.connections.groups_active))+row('Приватные группы',esc(d.connections.groups_active));const statuses=d.jobs.statuses||{};infra.innerHTML=row('Redis',d.redis.ok?`<span class="pill ok">OK · ${esc(d.redis.latency_ms)} мс</span>`:`<span class="pill bad">Ошибка</span>`)+row('Redis memory',esc(d.redis.used_memory_human||bytes(d.redis.used_memory)))+row('Jobs queued',esc(statuses.queued||0))+row('Jobs processing',esc(statuses.processing||0))+row('Jobs failed',esc(statuses.failed||0))+row('Старейшая задача',dt(d.jobs.oldest_queued_at))+row('Хранилище',`${bytes(d.storage.used)} / ${bytes(d.storage.total)}`)+`<div class="bar"><span style="width:${Math.min(100,d.storage.used_percent||0)}%"></span></div><div class="muted" style="margin-top:6px">Использовано ${esc(d.storage.used_percent)}%</div>`;archive.innerHTML=row('Диалоги',esc(d.archive.dialogs))+row('Сообщения',esc(d.archive.messages))+row('Изменённые',esc(d.archive.edited))+row('Удалённые',esc(d.archive.deleted))+row('Медиа',esc(d.archive.media))+Object.entries(d.archive.media_statuses||{}).map(([k,v])=>row('Медиа: '+k,esc(v))).join('');failures.innerHTML=d.recent_failures?.length?d.recent_failures.map(x=>`<div class="row"><span><b>${esc(x.type)}</b><div class="muted mono">${esc(x.error)}</div><div class="muted">${dt(x.created_at)} · ${esc(x.correlation_id)}</div></span><span class="pill bad">${esc(x.attempts)} попыт.</span></div>`).join(''):'<div class="empty">Нерешённых ошибок нет</div>'}async function load(){refresh.disabled=true;stamp.textContent='Обновление…';try{render(await api())}catch(e){stamp.textContent=e.message}finally{refresh.disabled=false}}refresh.onclick=load;load();setInterval(load,30000);</script></body></html>
