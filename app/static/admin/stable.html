<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Phantom Control Center</title>
<style>
:root{--bg:#07050c;--panel:#110c19;--line:#38254e;--text:#fff;--muted:#a79ab7;--accent:#9d3cff;--red:#ff7087}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 80% 0,rgba(157,60,255,.24),transparent 35%),var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);padding:24px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#171020,#0d0913);box-shadow:0 25px 70px rgba(0,0,0,.35)}h1{margin:0 0 5px}.muted{color:var(--muted)}label{display:block;margin-top:12px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#09070f;color:#fff;margin-top:7px;font:inherit}.btn{width:100%;border:0;border-radius:13px;padding:13px 15px;background:linear-gradient(135deg,#a33cff,#6929dc);color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:14px}.error{color:var(--red);min-height:22px;margin-top:8px}
</style>
</head>
<body>
<section class="login"><form id="loginForm" class="card"><h1>PHANTOM</h1><p class="muted">Control Center</p><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Пароль<input id="password" type="password" required autocomplete="current-password"></label><div id="loginError" class="error"></div><button class="btn">Войти</button></form></section>
<script>
const target='/admin/index.html?v=3.0.3';
const existing=sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');
if(existing){sessionStorage.setItem('adminToken',existing);location.replace(target)}
document.getElementById('loginForm').onsubmit=async event=>{event.preventDefault();const error=document.getElementById('loginError');error.textContent='';try{const response=await fetch('/api/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail||'Неверный email или пароль');if(!data.access_token)throw Error('Сервер не вернул токен доступа');sessionStorage.setItem('adminToken',data.access_token);localStorage.setItem('adminToken',data.access_token);location.replace(target)}catch(reason){error.textContent=reason.message||'Не удалось войти'}};
</script>
</body>
</html>
