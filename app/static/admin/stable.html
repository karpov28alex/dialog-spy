<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Phantom Control Center</title>
<style>
:root{--bg:#07050c;--panel:#110c19;--line:#38254e;--text:#fff;--muted:#a79ab7;--accent:#9d3cff;--red:#ff7087}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif}.hidden{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 0,rgba(157,60,255,.24),transparent 35%),var(--bg)}.login-card{width:min(430px,100%);padding:24px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#171020,#0d0913);box-shadow:0 25px 70px rgba(0,0,0,.35)}h1{margin:0 0 5px}small,.muted{color:var(--muted)}input,button{font:inherit}.field{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#09070f;color:white;margin:7px 0 13px}.btn{border:1px solid var(--line);border-radius:13px;padding:12px 15px;background:#171020;color:white;cursor:pointer}.btn.primary{width:100%;border:0;background:linear-gradient(135deg,#a33cff,#6929dc);font-weight:800}.error{color:var(--red);min-height:20px}.shell{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}.bar{border-bottom:1px solid var(--line);background:rgba(9,7,14,.97);padding:12px 16px;display:flex;align-items:center;gap:16px;min-width:0}.brand{font-weight:950;font-size:19px;flex:0 0 auto}.brand small{display:block;font-size:9px;letter-spacing:.16em}.nav{display:flex;gap:6px;overflow:auto;scrollbar-width:none;min-width:0}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;border:1px solid transparent;border-radius:12px;padding:10px 13px;background:transparent;color:var(--muted);cursor:pointer}.nav button.active{color:white;border-color:rgba(157,60,255,.3);background:linear-gradient(135deg,rgba(157,60,255,.34),rgba(105,41,220,.14))}.logout{margin-left:auto;flex:0 0 auto}.content{position:relative;min-height:0;background:var(--bg)}.frame{position:absolute;inset:0;border:0;width:100%;height:100%;display:none;background:var(--bg)}.frame.active{display:block}.loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);z-index:4;padding:24px;text-align:center}.loader.error{color:#ff9aac}.loader.hidden{display:none}@media(max-width:700px){.bar{display:block;padding:10px}.brand{margin:0 4px 8px}.nav{padding-bottom:1px}.logout{position:absolute;right:10px;top:10px;padding:8px 10px}.shell{grid-template-rows:126px minmax(0,1fr)}}
</style>
</head>
<body>
<section id="login" class="login"><form id="loginForm" class="login-card"><h1>PHANTOM</h1><p class="muted">Единая защищённая админка без вложенных панелей</p><label>Email<input id="email" class="field" type="email" required></label><label>Пароль<input id="password" class="field" type="password" required></label><div id="loginError" class="error"></div><button class="btn primary">Войти</button></form></section>
<section id="app" class="shell hidden"><header class="bar"><div class="brand">PHANTOM<small>CONTROL CENTER 3.0.2</small></div><nav class="nav"><button class="active" data-page="operations" data-src="/admin/operations.html?v=3.0.2">🩺 Операции</button><button data-page="dialogs" data-src="/admin/dialogs-media.html?v=3.0.2">💬 Диалоги</button><button data-page="dashboard" data-src="/admin/platform.html?v=3.0.2">⚡ Dashboard</button><button data-page="users" data-src="/admin/user360-v2.html?v=3.0.2">👤 User360</button><button data-page="billing" data-src="/admin/billing-v2-1.html?v=3.0.2">💳 Billing</button><button data-page="funnel" data-src="/admin/funnel.html?v=3.0.2">🔐 Воронка</button><button data-page="settings" data-src="/admin/index.html?v=3.0.2">⚙️ Старые функции</button></nav><button id="logout" class="btn logout">Выйти</button></header><main class="content"><div id="loader" class="loader">Загрузка…</div><iframe id="operations" class="frame active" title="Операции"></iframe><iframe id="dialogs" class="frame" title="Диалоги"></iframe><iframe id="dashboard" class="frame" title="Dashboard"></iframe><iframe id="users" class="frame" title="User360"></iframe><iframe id="billing" class="frame" title="Billing"></iframe><iframe id="funnel" class="frame" title="Воронка"></iframe><iframe id="settings" class="frame" title="Старые функции"></iframe></main></section>
<script>
const byId=id=>document.getElementById(id);
const state={token:sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken'),timer:null};
const loader=byId('loader');
const frameMap={operations:byId('operations'),dialogs:byId('dialogs'),dashboard:byId('dashboard'),users:byId('users'),billing:byId('billing'),funnel:byId('funnel'),settings:byId('settings')};
function showError(message){clearTimeout(state.timer);loader.textContent=message+' Нажмите вкладку ещё раз.';loader.classList.remove('hidden');loader.classList.add('error')}
function openPage(name){const frame=frameMap[name];const button=document.querySelector(`[data-page="${name}"]`);if(!frame||!button){showError('Раздел админки не найден.');return}loader.textContent='Загрузка…';loader.classList.remove('hidden','error');frame.src='about:blank';requestAnimationFrame(()=>{frame.src=button.dataset.src});clearTimeout(state.timer);state.timer=setTimeout(()=>showError('Раздел загружается слишком долго.'),12000)}
function activate(name){document.querySelectorAll('[data-page],.frame').forEach(element=>element.classList.remove('active'));const button=document.querySelector(`[data-page="${name}"]`);button.classList.add('active');frameMap[name].classList.add('active');openPage(name)}
Object.entries(frameMap).forEach(([name,frame])=>{frame.addEventListener('load',()=>{if(!frame.src||frame.src==='about:blank'||frame.src.endsWith('/admin'))return;clearTimeout(state.timer);loader.classList.add('hidden');loader.classList.remove('error')});frame.addEventListener('error',()=>showError(`Не удалось открыть раздел «${name}».`))});
document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>activate(button.dataset.page));
byId('loginForm').onsubmit=async event=>{event.preventDefault();byId('loginError').textContent='';try{const response=await fetch('/api/admin/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:byId('email').value,password:byId('password').value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail||'Неверный email или пароль');if(!data.access_token)throw Error('Сервер не вернул токен доступа');sessionStorage.setItem('adminToken',data.access_token);localStorage.setItem('adminToken',data.access_token);location.replace('/admin?v=3.0.2')}catch(error){byId('loginError').textContent=error.message}};
byId('logout').onclick=()=>{sessionStorage.removeItem('adminToken');localStorage.removeItem('adminToken');location.replace('/admin?v=3.0.2')};
if(state.token){byId('login').classList.add('hidden');byId('app').classList.remove('hidden');openPage('operations')}
</script>
</body>
</html>
