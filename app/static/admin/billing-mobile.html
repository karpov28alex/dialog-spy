<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Billing Mobile</title><style>:root{--bg:#08060d;--p:#130f1c;--l:#352644;--t:#faf8ff;--m:#aa9eb8;--a:#a84cff;--g:#42d392;--r:#ff6c82;--y:#ffd06b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui;padding-bottom:max(18px,env(safe-area-inset-bottom))}.w{padding:14px}.back{color:white;text-decoration:none}.ey{color:#ca91ff;font-size:11px;letter-spacing:.14em;font-weight:900}.card{border:1px solid var(--l);background:linear-gradient(145deg,#15101f,#0e0b15);border-radius:17px;padding:14px;margin:12px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px;border:1px solid var(--l);border-radius:12px;background:#0c0911}.metric small{display:block;color:var(--m)}.metric b{font-size:20px}.in,.btn{width:100%;min-height:46px;border:1px solid var(--l);border-radius:13px;background:#0d0a13;color:white;padding:11px 13px;font:inherit}.btn{background:linear-gradient(135deg,#7924d0,#b850ff);border:0;font-weight:800}.filters{display:grid;gap:8px}.payment{border:1px solid var(--l);border-radius:14px;padding:12px;margin:9px 0;background:#0c0911}.payment-head{display:flex;justify-content:space-between;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;color:var(--m)}.row b{color:var(--t);text-align:right;overflow-wrap:anywhere}.badge{padding:4px 8px;border-radius:999px;font-size:12px}.paid{color:#80efb9;background:rgba(66,211,146,.12)}.failed{color:#ff9aaa;background:rgba(255,108,130,.12)}.pending,.processing{color:#ffdb88;background:rgba(255,208,107,.12)}.muted{color:var(--m)}.err{color:#ff9dac}.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{text-align:center;color:var(--m);padding:22px}</style></head><body><main class="w"><a class="back" href="/admin">← Панель</a><div class="ey">PHANTOM CONTROL CENTER</div><h1>Платежи</h1><section class="metrics" id="metrics"></section><section class="card"><div class="filters"><input class="in" id="query" placeholder="ID, username или операция" autocapitalize="none"><select class="in" id="status"><option value="all">Все статусы</option><option value="paid">Успешные</option><option value="failed">Ошибки</option><option value="pending">Ожидают</option><option value="processing">В обработке</option></select><select class="in" id="kind"><option value="all">Все типы</option><option value="initial">Первый</option><option value="renewal">Продление</option><option value="fallback">Резервный</option><option value="manual">Ручной</option></select><button class="btn" id="find">Найти</button></div><div id="notice"></div><div id="rows"><div class="empty">Загрузка…</div></div><div class="pager"><button class="in" id="prev">← Назад</button><button class="in" id="next">Вперёд →</button></div></section></main><script>const E={metrics:document.getElementById('metrics'),q:document.getElementById('query'),status:document.getElementById('status'),kind:document.getElementById('kind'),find:document.getElementById('find'),notice:document.getElementById('notice'),rows:document.getElementById('rows'),prev:document.getElementById('prev'),next:document.getElementById('next')};const token=()=>sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(v||0);const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';async function api(url){const r=await fetch(url,{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin';throw Error('Требуется повторный вход')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:(d.error?.message||'Ошибка API'));return d}const badge=s=>`<span class="badge ${esc(s)}">${({paid:'Оплачен',failed:'Ошибка',pending:'Ожидает',processing:'Обработка'})[s]||esc(s)}</span>`;let offset=0,total=0;const limit=20;async function overview(){const d=await api('/api/admin/impaya/overview');const items=[['Выручка всего',money(d.revenue.all_time)],['30 дней',money(d.revenue.last_30d)],['Сегодня',money(d.revenue.today)],['Успешность',d.payments.success_rate+'%'],['Карты',d.subscriptions.cards_bound],['Автопродления',d.subscriptions.auto_renew_enabled]];E.metrics.innerHTML=items.map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}async function load(){E.notice.innerHTML='';E.rows.innerHTML='<div class="empty">Загрузка…</div>';try{const p=new URLSearchParams({status:E.status.value,kind:E.kind.value,q:E.q.value.trim(),limit,offset}),d=await api('/api/admin/impaya/payments?'+p);total=d.total;E.rows.innerHTML=d.items.length?d.items.map(x=>`<article class="payment"><div class="payment-head"><b>${esc(x.name||x.username||x.telegram_id)}</b>${badge(x.status)}</div><div class="muted">${esc(x.username?'@'+x.username:x.telegram_id)}</div><div class="row"><span>Сумма</span><b>${money(x.amount)}</b></div><div class="row"><span>Тип</span><b>${esc(x.kind)}</b></div><div class="row"><span>Операция</span><b>${esc(x.transaction_id||x.external_id||'—')}</b></div><div class="row"><span>Дата</span><b>${dt(x.paid_at||x.created_at)}</b></div></article>`).join(''):'<div class="empty">Операции не найдены</div>';E.prev.disabled=offset===0;E.next.disabled=offset+limit>=total}catch(e){E.rows.innerHTML='';E.notice.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}E.find.onclick=()=>{offset=0;load()};E.prev.onclick=()=>{offset=Math.max(0,offset-limit);load()};E.next.onclick=()=>{offset+=limit;load()};Promise.all([overview(),load()]).catch(e=>E.notice.innerHTML='<p class="err">'+esc(e.message)+'</p>');</script></body></html>
