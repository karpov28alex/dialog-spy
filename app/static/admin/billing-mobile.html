<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Финансы · Phantom</title><style>:root{--bg:#08060d;--p:#130f1c;--l:#352644;--t:#faf8ff;--m:#aa9eb8;--a:#a84cff;--g:#42d392;--r:#ff6c82;--y:#ffd06b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui;padding-bottom:max(18px,env(safe-area-inset-bottom))}.w{padding:14px}.ey{color:#ca91ff;font-size:11px;letter-spacing:.14em;font-weight:900}.card{border:1px solid var(--l);background:linear-gradient(145deg,#15101f,#0e0b15);border-radius:17px;padding:14px;margin:12px 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px;border:1px solid var(--l);border-radius:12px;background:#0c0911}.metric small{display:block;color:var(--m)}.metric b{font-size:20px}.in,.btn{width:100%;min-height:46px;border:1px solid var(--l);border-radius:13px;background:#0d0a13;color:white;padding:11px 13px;font:inherit}.btn{background:linear-gradient(135deg,#7924d0,#b850ff);border:0;font-weight:800}.btn.secondary{background:#0d0a13;border:1px solid var(--l)}.btn.danger{background:rgba(255,108,130,.12);border:1px solid rgba(255,108,130,.4);color:#ff9aaa}.filters,.stack{display:grid;gap:8px}.payment,.user{border:1px solid var(--l);border-radius:14px;padding:12px;margin:9px 0;background:#0c0911}.payment-head{display:flex;justify-content:space-between;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;color:var(--m)}.row b{color:var(--t);text-align:right;overflow-wrap:anywhere}.badge{padding:4px 8px;border-radius:999px;font-size:12px}.paid{color:#80efb9;background:rgba(66,211,146,.12)}.failed{color:#ff9aaa;background:rgba(255,108,130,.12)}.pending,.processing{color:#ffdb88;background:rgba(255,208,107,.12)}.muted{color:var(--m)}.ok{color:#80efb9}.err{color:#ff9dac}.pager,.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{text-align:center;color:var(--m);padding:22px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button.active{outline:2px solid #b850ff}.hidden{display:none}h2{font-size:20px;margin:6px 0 12px}</style></head><body><main class="w"><div class="ey">PHANTOM CONTROL CENTER</div><h1>Финансы</h1><section class="metrics" id="metrics"></section><section class="card"><div class="tabs"><button class="btn secondary active" data-pane="history">Операции</button><button class="btn secondary" data-pane="charge">Списать</button></div><div id="history"><div class="filters" style="margin-top:12px"><input class="in" id="query" placeholder="ID, username или операция" autocapitalize="none"><select class="in" id="status"><option value="all">Все статусы</option><option value="paid">Успешные</option><option value="failed">Ошибки</option><option value="pending">Ожидают</option><option value="processing">В обработке</option></select><button class="btn" id="find">Найти</button></div><div id="notice"></div><div id="rows"><div class="empty">Загрузка…</div></div><div class="pager"><button class="in" id="prev">← Назад</button><button class="in" id="next">Вперёд →</button></div></div><div id="charge" class="hidden"><h2>Ручное списание</h2><div class="stack"><input class="in" id="userQuery" placeholder="@username, Telegram ID или имя"><button class="btn secondary" id="userFind">Найти пользователя</button><div id="userResults"></div><div id="selectedUser" class="muted">Пользователь не выбран</div><div class="two"><input class="in" type="number" id="amount" min="1" value="100" placeholder="Сумма ₽"><input class="in" type="number" id="days" min="0" value="0" placeholder="Дней VIP"></div><input class="in" id="reason" placeholder="Причина списания"><button class="btn" id="prepare">Подготовить списание</button><div id="confirmBlock" class="hidden"><div id="summary" class="payment"></div><input class="in" id="code" inputmode="numeric" placeholder="Код подтверждения"><button class="btn danger" id="confirm">Подтвердить списание</button></div><div id="chargeNotice"></div></div></div></section></main><script>const $=id=>document.getElementById(id),E={metrics:$('metrics'),q:$('query'),status:$('status'),find:$('find'),notice:$('notice'),rows:$('rows'),prev:$('prev'),next:$('next'),userQuery:$('userQuery'),userFind:$('userFind'),userResults:$('userResults'),selectedUser:$('selectedUser'),amount:$('amount'),days:$('days'),reason:$('reason'),prepare:$('prepare'),confirmBlock:$('confirmBlock'),summary:$('summary'),code:$('code'),confirm:$('confirm'),chargeNotice:$('chargeNotice')};const token=()=>sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(v||0);const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'}),d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin';throw Error('Требуется повторный вход')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:(d.error?.message||'Ошибка API'));return d}const badge=s=>`<span class="badge ${esc(s)}">${({paid:'Оплачен',failed:'Ошибка',pending:'Ожидает',processing:'Обработка'})[s]||esc(s)}</span>`;let offset=0,total=0,selected=null,requestId=null;const limit=20;async function overview(){const d=await api('/api/admin/impaya/overview');const items=[['Выручка всего',money(d.revenue.all_time)],['30 дней',money(d.revenue.last_30d)],['Сегодня',money(d.revenue.today)],['Успешность',d.payments.success_rate+'%'],['Карты',d.subscriptions.cards_bound],['Автопродления',d.subscriptions.auto_renew_enabled]];E.metrics.innerHTML=items.map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}async function load(){E.notice.innerHTML='';E.rows.innerHTML='<div class="empty">Загрузка…</div>';try{const p=new URLSearchParams({status:E.status.value,kind:'all',q:E.q.value.trim(),limit,offset}),d=await api('/api/admin/impaya/payments?'+p);total=d.total;E.rows.innerHTML=d.items.length?d.items.map(x=>`<article class="payment"><div class="payment-head"><b>${esc(x.name||x.username||x.telegram_id)}</b>${badge(x.status)}</div><div class="muted">${esc(x.username?'@'+x.username:x.telegram_id)}</div><div class="row"><span>Сумма</span><b>${money(x.amount)}</b></div><div class="row"><span>Тип</span><b>${esc(x.kind)}</b></div><div class="row"><span>Операция</span><b>${esc(x.transaction_id||x.external_id||'—')}</b></div><div class="row"><span>Дата</span><b>${dt(x.paid_at||x.created_at)}</b></div></article>`).join(''):'<div class="empty">Операции не найдены</div>';E.prev.disabled=offset===0;E.next.disabled=offset+limit>=total}catch(e){E.rows.innerHTML='';E.notice.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}async function findUsers(){E.userResults.innerHTML='<div class="empty">Поиск…</div>';try{const d=await api('/api/admin/user360/search?q='+encodeURIComponent(E.userQuery.value.trim()));E.userResults.innerHTML=d.items.length?d.items.map(u=>`<button type="button" class="user in" data-user="${u.id}"><b>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||u.telegram_id)}</b><br><span class="muted">${esc(u.username?'@'+u.username:u.telegram_id)}</span></button>`).join(''):'<div class="empty">Никого не найдено</div>';E.userResults.querySelectorAll('[data-user]').forEach(btn=>btn.onclick=()=>{const u=d.items.find(x=>String(x.id)===btn.dataset.user);selected=u;E.selectedUser.innerHTML=`Выбран: <b>${esc(u.username?'@'+u.username:u.telegram_id)}</b>`;E.userResults.innerHTML=''})}catch(e){E.userResults.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}async function prepare(){if(!selected)return E.chargeNotice.innerHTML='<p class="err">Сначала выберите пользователя</p>';try{const d=await api('/api/admin/impaya/manual-charge/prepare',{method:'POST',body:JSON.stringify({user_id:selected.id,amount_rub:+E.amount.value,access_days:+E.days.value,reason:E.reason.value.trim()})});requestId=d.request_id;E.summary.innerHTML=`<b>${esc(d.user.username?'@'+d.user.username:d.user.telegram_id)}</b><div class="row"><span>Сумма</span><b>${money(d.amount_rub)}</b></div><div class="row"><span>Карта</span><b>${esc(d.card.pan_mask||'привязана')}</b></div><div class="row"><span>Код</span><b>${esc(d.confirmation_code)}</b></div>`;E.code.value=d.confirmation_code;E.confirmBlock.classList.remove('hidden');E.chargeNotice.innerHTML='<p class="ok">Заявка подготовлена. Проверьте данные и подтвердите.</p>'}catch(e){E.chargeNotice.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}async function confirm(){if(!requestId)return;try{const d=await api('/api/admin/impaya/manual-charge/'+requestId+'/confirm',{method:'POST',body:JSON.stringify({confirmation_code:E.code.value.trim()})});E.chargeNotice.innerHTML='<p class="ok">Списание выполнено: '+money(d.amount_rub||E.amount.value)+'</p>';E.confirmBlock.classList.add('hidden');requestId=null;overview();load()}catch(e){E.chargeNotice.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}document.querySelectorAll('[data-pane]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('active',x===btn));$('history').classList.toggle('hidden',btn.dataset.pane!=='history');$('charge').classList.toggle('hidden',btn.dataset.pane!=='charge')});E.find.onclick=()=>{offset=0;load()};E.prev.onclick=()=>{offset=Math.max(0,offset-limit);load()};E.next.onclick=()=>{offset+=limit;load()};E.userFind.onclick=findUsers;E.prepare.onclick=prepare;E.confirm.onclick=confirm;Promise.all([overview(),load()]).catch(e=>E.notice.innerHTML='<p class="err">'+esc(e.message)+'</p>');</script></body></html>
