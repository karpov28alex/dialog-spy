<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>User360</title><style>:root{--bg:#08060d;--p:#130f1c;--l:#352644;--t:#faf8ff;--m:#aa9eb8;--a:#a84cff;--g:#42d392;--r:#ff6c82}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui;padding-bottom:max(18px,env(safe-area-inset-bottom))}.w{padding:14px}.ey{color:#ca91ff;font-size:11px;letter-spacing:.14em;font-weight:900}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}.in,.btn{min-height:46px;border:1px solid var(--l);border-radius:13px;background:#0d0a13;color:white;padding:11px 13px;font:inherit}.btn{background:linear-gradient(135deg,#7924d0,#b850ff);border:0;font-weight:800}.card{border:1px solid var(--l);background:linear-gradient(145deg,#15101f,#0e0b15);border-radius:17px;padding:14px;margin:12px 0}.user{width:100%;text-align:left;padding:12px;border:1px solid var(--l);border-radius:13px;margin:8px 0}.user b{display:block}.muted{color:var(--m)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{min-height:82px;padding:11px;border:1px solid var(--l);border-radius:12px;background:#0c0911;color:white;text-align:left}.metric small{display:block;color:var(--m)}.metric b{font-size:20px}.metric:active,.rowbtn:active{transform:scale(.98)}.row,.rowbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border:0;border-bottom:1px solid var(--l);background:transparent;color:white;width:100%;text-align:left}.rowbtn::after{content:'›';color:#c583ff;font-size:24px}.stack{display:grid;gap:8px}.danger{background:#2a111b;color:#ff9dac;border:1px solid #713044}.ok{color:#7be9b3}.err{color:#ff9dac}.empty{text-align:center;color:var(--m);padding:24px}.detail h3{margin-top:0}.item{padding:11px 0;border-bottom:1px solid var(--l)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#2a1740;color:#e2bfff}.link{color:#d59cff;text-decoration:none}@media(max-width:420px){.search{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head><body data-user360-native="true"><main class="w"><div class="ey">PHANTOM CONTROL CENTER</div><h1>User360</h1><div class="search"><input class="in" id="query" placeholder="@username, ID или имя" autocapitalize="none"><button class="btn" id="searchBtn">Найти</button></div><div id="notice"></div><section class="card" id="results"><div class="empty">Введите пользователя</div></section><section id="profile"></section></main><script>const E={q:document.getElementById('query'),search:document.getElementById('searchBtn'),notice:document.getElementById('notice'),results:document.getElementById('results'),profile:document.getElementById('profile')};const token=()=>sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin';throw Error('Требуется повторный вход')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:(d.error?.message||'Ошибка API'));return d}function fail(e){E.notice.innerHTML='<div class="card err">'+esc(e.message)+'</div>'}async function search(){E.notice.innerHTML='';E.results.innerHTML='<div class="empty">Поиск…</div>';try{const d=await api('/api/admin/user360/search?q='+encodeURIComponent(E.q.value.trim()));E.results.innerHTML=d.items.length?d.items.map(u=>`<button class="user in" data-id="${u.id}"><b>${esc(u.name||u.username||u.telegram_id)}</b><span class="muted">${esc(u.username?'@'+u.username:u.telegram_id)} · ${esc(u.subscription_status)}</span></button>`).join(''):'<div class="empty">Пользователь не найден</div>';E.results.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>load(+x.dataset.id))}catch(e){E.results.innerHTML='';fail(e)}}function renderDetail(kind,d){const u=d.user,m=d.metrics;const rows={payments:()=>`<h3>Платежи</h3>${d.payments.length?d.payments.map(p=>`<div class="item"><b>${money(p.amount)}</b> · ${esc(p.status)}<div class="muted">${dt(p.paid_at||p.created_at)} · ${esc(p.provider)}</div></div>`).join(''):'<div class="empty">Платежей нет</div>'}`,subscriptions:()=>`<h3>История доступа</h3>${d.subscriptions.length?d.subscriptions.map(s=>`<div class="item"><b>${esc(s.status)}</b> · ${esc(s.source)}<div class="muted">${dt(s.starts_at)} — ${dt(s.ends_at)}</div></div>`).join(''):'<div class="empty">Истории нет</div>'}`,referrals:()=>`<h3>Приглашённые</h3>${d.referrals.length?d.referrals.map(r=>`<button class="rowbtn" data-open-user="${r.user.id}"><span><b>${esc(r.user.name||r.user.username||r.user.telegram_id)}</b><br><span class="muted">${esc(r.user.username?'@'+r.user.username:r.user.telegram_id)}</span></span></button>`).join(''):'<div class="empty">Приглашённых нет</div>'}`,connections:()=>`<h3>Подключения</h3>${d.connections.length?d.connections.map(c=>`<div class="item"><b>${c.active?'Активно':'Отключено'}</b><div class="muted">ID ${esc(c.telegram_connection_id)}<br>Подключено: ${dt(c.connected_at)}<br>Последняя активность: ${dt(c.last_activity_at)}</div></div>`).join(''):'<div class="empty">Подключений нет</div>'}`,active:()=>`<h3>Активные подключения</h3>${d.connections.filter(c=>c.active).length?d.connections.filter(c=>c.active).map(c=>`<div class="item"><b>Активно</b><div class="muted">ID ${esc(c.telegram_connection_id)} · ${dt(c.last_activity_at)}</div></div>`).join(''):'<div class="empty">Активных подключений нет</div>'}`,timeline:()=>`<h3>Последние события</h3>${d.timeline.map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="muted">${dt(x.at)}</div></div>`).join('')}`,dialogs:()=>`<h3>Диалоги и сообщения</h3><p>Диалогов: <b>${m.dialogs}</b><br>Сообщений: <b>${m.messages}</b><br>Изменено: <b>${m.edited}</b><br>Удалено: <b>${m.deleted}</b></p><a class="btn link" href="/admin/dialogs-media.html?user_id=${u.id}">Открыть архив пользователя</a>`,media:()=>`<h3>Медиа</h3><p>Всего: <b>${m.media}</b><br>Защищённых: <b>${m.protected_media}</b></p><a class="btn link" href="/admin/dialogs-media.html?user_id=${u.id}&media=1">Открыть медиа пользователя</a>`};document.getElementById('detail').innerHTML=rows[kind]?.()||'';document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('[data-open-user]').forEach(x=>x.onclick=()=>load(+x.dataset.openUser))}async function load(id){E.profile.innerHTML='<div class="card empty">Загрузка карточки…</div>';try{const d=await api('/api/admin/user360/users/'+id),u=d.user,m=d.metrics;let inviter='<span class="muted">Прямое подключение</span>';if(u.referrer_user_id){try{const r=await api('/api/admin/user360/users/'+u.referrer_user_id),ru=r.user;inviter=`<button class="rowbtn" id="openReferrer"><span>Пригласил: <b>${esc(ru.username?'@'+ru.username:(ru.name||ru.telegram_id))}</b></span></button>`;setTimeout(()=>{document.getElementById('openReferrer').onclick=()=>load(ru.id)},0)}catch(_){inviter='<span class="muted">Приглашение, источник недоступен</span>'}}const cards=[['Диалоги',m.dialogs,'dialogs'],['Сообщения',m.messages,'dialogs'],['Изменено',m.edited,'dialogs'],['Удалено',m.deleted,'dialogs'],['Медиа',m.media,'media'],['Защищённые медиа',m.protected_media,'media'],['Оплаты',m.payments,'payments'],['Оплачено всего',money(m.paid_total),'payments'],['Средний чек',money(m.average_check),'payments'],['Приглашено',m.referrals,'referrals'],['Подключения',m.business_connections,'connections'],['Активные подключения',m.active_business,'active']];E.profile.innerHTML=`<section class="card"><h2>${esc(u.name||u.username||u.telegram_id)}</h2><div class="muted">${esc(u.username?'@'+u.username:'без username')} · Telegram ${esc(u.telegram_id)}</div><div style="margin-top:12px">${inviter}</div><div class="metrics" style="margin-top:12px">${cards.map(x=>`<button class="metric" data-detail="${x[2]}"><small>${x[0]}</small><b>${x[1]}</b></button>`).join('')}</div><button class="rowbtn" data-detail="timeline"><span>Последние события</span></button></section><section class="card"><h3>Доступ</h3><button class="rowbtn" data-detail="subscriptions"><span>Статус: <b>${esc(u.subscription_status)}</b></span></button><button class="rowbtn" data-detail="subscriptions"><span>Trial до: <b>${dt(u.trial_ends_at)}</b></span></button><button class="rowbtn" data-detail="subscriptions"><span>VIP до: <b>${dt(u.vip_ends_at)}</b></span></button><div class="stack" style="margin-top:12px"><input class="in" id="days" type="number" value="7"><button class="btn" id="grant">Выдать / продлить VIP</button><button class="in danger" id="block">Заблокировать доступ</button><button class="in" id="unblock">Разблокировать доступ</button></div><div id="actionMsg"></div></section><section class="card detail" id="detail"><div class="empty">Нажмите на показатель, чтобы открыть подробности</div></section>`;document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=()=>renderDetail(x.dataset.detail,d));const action=async(fn)=>{const box=document.getElementById('actionMsg');try{await fn();box.innerHTML='<p class="ok">Готово</p>';await load(id)}catch(e){box.innerHTML='<p class="err">'+esc(e.message)+'</p>'}};document.getElementById('grant').onclick=()=>action(()=>api('/api/admin/user360/users/'+id+'/grant',{method:'POST',body:JSON.stringify({days:+document.getElementById('days').value,kind:'vip'})}));document.getElementById('block').onclick=()=>action(()=>api('/api/admin/growth/users/'+id+'/access',{method:'PATCH',body:JSON.stringify({disabled:true,reason:'Mobile User360'})}));document.getElementById('unblock').onclick=()=>action(()=>api('/api/admin/growth/users/'+id+'/access',{method:'PATCH',body:JSON.stringify({disabled:false,reason:'Mobile User360'})}))}catch(e){E.profile.innerHTML='';fail(e)}}E.search.onclick=search;E.q.onkeydown=e=>{if(e.key==='Enter')search()};const initial=new URLSearchParams(location.search).get('user_id');if(initial)load(Number(initial));</script></body></html>
