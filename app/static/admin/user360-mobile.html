<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>User360 Mobile</title><style>:root{--bg:#08060d;--p:#130f1c;--l:#352644;--t:#faf8ff;--m:#aa9eb8;--a:#a84cff;--g:#42d392;--r:#ff6c82}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui;padding-bottom:max(18px,env(safe-area-inset-bottom))}.w{padding:14px}.back{color:white;text-decoration:none}.ey{color:#ca91ff;font-size:11px;letter-spacing:.14em;font-weight:900}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}.in,.btn{min-height:46px;border:1px solid var(--l);border-radius:13px;background:#0d0a13;color:white;padding:11px 13px;font:inherit}.btn{background:linear-gradient(135deg,#7924d0,#b850ff);border:0;font-weight:800}.card{border:1px solid var(--l);background:linear-gradient(145deg,#15101f,#0e0b15);border-radius:17px;padding:14px;margin:12px 0}.user{padding:12px;border:1px solid var(--l);border-radius:13px;margin:8px 0}.user b{display:block}.muted{color:var(--m)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px;border:1px solid var(--l);border-radius:12px;background:#0c0911}.metric small{display:block;color:var(--m)}.metric b{font-size:20px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--l)}.stack{display:grid;gap:8px}.danger{background:#2a111b;color:#ff9dac;border:1px solid #713044}.ok{color:#7be9b3}.err{color:#ff9dac}.empty{text-align:center;color:var(--m);padding:24px}@media(max-width:420px){.search{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head><body><main class="w"><a class="back" href="/admin">← Панель</a><div class="ey">PHANTOM CONTROL CENTER</div><h1>User360</h1><div class="search"><input class="in" id="query" placeholder="@username, ID или имя" autocapitalize="none"><button class="btn" id="searchBtn">Найти</button></div><div id="notice"></div><section class="card" id="results"><div class="empty">Введите пользователя</div></section><section id="profile"></section></main><script>const E={q:document.getElementById('query'),search:document.getElementById('searchBtn'),notice:document.getElementById('notice'),results:document.getElementById('results'),profile:document.getElementById('profile')};const token=()=>sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin';throw Error('Требуется повторный вход')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:(d.error?.message||'Ошибка API'));return d}function fail(e){E.notice.innerHTML='<div class="card err">'+esc(e.message)+'</div>'}async function search(){E.notice.innerHTML='';E.results.innerHTML='<div class="empty">Поиск…</div>';try{const d=await api('/api/admin/user360/search?q='+encodeURIComponent(E.q.value.trim()));E.results.innerHTML=d.items.length?d.items.map(u=>`<button class="user in" style="width:100%;text-align:left" data-id="${u.id}"><b>${esc(u.name||u.username||u.telegram_id)}</b><span class="muted">${esc(u.username?'@'+u.username:u.telegram_id)} · ${esc(u.subscription_status)}</span></button>`).join(''):'<div class="empty">Пользователь не найден</div>';E.results.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>load(+x.dataset.id))}catch(e){E.results.innerHTML='';fail(e)}}async function load(id){E.profile.innerHTML='<div class="card empty">Загрузка карточки…</div>';try{const d=await api('/api/admin/user360/users/'+id),u=d.user,m=d.metrics;E.profile.innerHTML=`<section class="card"><h2>${esc(u.name||u.username||u.telegram_id)}</h2><div class="muted">${esc(u.username?'@'+u.username:'без username')} · Telegram ${esc(u.telegram_id)}</div><div class="metrics" style="margin-top:12px">${[['Диалоги',m.dialogs],['Сообщения',m.messages],['Изменено',m.edited],['Удалено',m.deleted],['Медиа',m.media],['Оплаты',m.payments]].map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div></section><section class="card"><h3>Доступ</h3><div class="row"><span>Статус</span><b>${esc(u.subscription_status)}</b></div><div class="row"><span>Trial до</span><b>${dt(u.trial_ends_at)}</b></div><div class="row"><span>VIP до</span><b>${dt(u.vip_ends_at)}</b></div><div class="stack" style="margin-top:12px"><input class="in" id="days" type="number" value="7"><button class="btn" id="grant">Выдать / продлить VIP</button><button class="in danger" id="block">Заблокировать доступ</button><button class="in" id="unblock">Разблокировать доступ</button></div><div id="actionMsg"></div></section>`;const action=async(fn)=>{const box=document.getElementById('actionMsg');try{await fn();box.innerHTML='<p class="ok">Готово</p>';await load(id)}catch(e){box.innerHTML='<p class="err">'+esc(e.message)+'</p>'}};document.getElementById('grant').onclick=()=>action(()=>api('/api/admin/user360/users/'+id+'/grant',{method:'POST',body:JSON.stringify({days:+document.getElementById('days').value,kind:'vip'})}));document.getElementById('block').onclick=()=>action(()=>api('/api/admin/growth/users/'+id+'/access',{method:'PATCH',body:JSON.stringify({disabled:true,reason:'Mobile User360'})}));document.getElementById('unblock').onclick=()=>action(()=>api('/api/admin/growth/users/'+id+'/access',{method:'PATCH',body:JSON.stringify({disabled:false,reason:'Mobile User360'})}))}catch(e){E.profile.innerHTML='';fail(e)}}E.search.onclick=search;E.q.onkeydown=e=>{if(e.key==='Enter')search()};</script></body></html>
