<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>User360</title><style>:root{--bg:#08060d;--panel:#130f1c;--line:#352644;--text:#faf8ff;--muted:#aa9eb8;--accent:#a84cff;--green:#42d392;--red:#ff6c82}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui;padding-bottom:max(20px,env(safe-area-inset-bottom))}.wrap{padding:14px}.eyebrow{color:#ca91ff;font-size:11px;letter-spacing:.14em;font-weight:900}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}.input,.button{min-height:46px;border:1px solid var(--line);border-radius:13px;background:#0d0a13;color:#fff;padding:11px 13px;font:inherit}.button{border:0;background:linear-gradient(135deg,#7924d0,#b850ff);font-weight:800}.card{border:1px solid var(--line);background:linear-gradient(145deg,#15101f,#0e0b15);border-radius:18px;padding:14px;margin:12px 0}.muted{color:var(--muted)}.error{color:#ff9dac}.ok{color:#7be9b3}.empty{text-align:center;color:var(--muted);padding:24px}.user{display:block;width:100%;text-align:left;margin:8px 0}.user b{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{min-height:86px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#0c0911;color:#fff;text-align:left}.metric small{display:block;color:var(--muted)}.metric b{font-size:21px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:#fff;text-align:left}.clickable::after{content:'›';color:#ca91ff;font-size:24px}.stack{display:grid;gap:8px}.danger{background:#2a111b;color:#ff9dac;border:1px solid #713044}.item{padding:11px 0;border-bottom:1px solid var(--line)}.link{display:inline-block;text-decoration:none;color:#fff;margin-top:8px}.technical{font-size:12px;color:var(--muted)}@media(max-width:420px){.search{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}</style></head><body data-user360-native="true"><main class="wrap"><div class="eyebrow">PHANTOM CONTROL CENTER</div><h1>User360</h1><div class="search"><input class="input" id="query" placeholder="@username, ID или имя" autocapitalize="none"><button class="button" id="searchBtn">Найти</button></div><div id="notice"></div><section class="card" id="results"><div class="empty">Введите пользователя</div></section><section id="profile"></section></main><script>const E={q:document.getElementById('query'),search:document.getElementById('searchBtn'),notice:document.getElementById('notice'),results:document.getElementById('results'),profile:document.getElementById('profile')};const token=()=>sessionStorage.getItem('adminToken')||localStorage.getItem('adminToken');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ru-RU'):'—';const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));const statusLabel=v=>({referral:'По приглашению',trial:'Пробный доступ',vip:'VIP',expired:'Доступ завершён',none:'Без доступа'}[v]||v||'—');async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/admin';throw Error('Требуется повторный вход')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:(d.error?.message||'Ошибка API'));return d}function purgeLegacy(){document.querySelectorAll('[data-user360-extra]').forEach(node=>node.remove())}purgeLegacy();new MutationObserver(purgeLegacy).observe(document.body,{childList:true,subtree:true});function fail(error){E.notice.innerHTML='<div class="card error">'+esc(error.message)+'</div>'}async function search(){E.notice.innerHTML='';E.results.innerHTML='<div class="empty">Поиск…</div>';try{const d=await api('/api/admin/user360/search?q='+encodeURIComponent(E.q.value.trim()));E.results.innerHTML=d.items.length?d.items.map(u=>`<button class="input user" data-id="${u.id}"><b>${esc(u.name||u.username||u.telegram_id)}</b><span class="muted">${esc(u.username?'@'+u.username:u.telegram_id)} · ${esc(statusLabel(u.subscription_status))}</span></button>`).join(''):'<div class="empty">Пользователь не найден</div>';E.results.querySelectorAll('[data-id]').forEach(node=>node.onclick=()=>load(Number(node.dataset.id)))}catch(error){E.results.innerHTML='';fail(error)}}function detail(kind,d){const u=d.user,m=d.metrics;const rows={payments:()=>`<h3>Платежи</h3>${d.payments.length?d.payments.map(p=>`<div class="item"><b>${money(p.amount)}</b> · ${esc(p.status)}<div class="muted">${dt(p.paid_at||p.created_at)} · ${esc(p.provider)}</div></div>`).join(''):'<div class="empty">Платежей нет</div>'}`,subscriptions:()=>`<h3>История доступа</h3>${d.subscriptions.length?d.subscriptions.map(s=>`<div class="item"><b>${esc(statusLabel(s.status))}</b> · ${esc(s.source)}<div class="muted">${dt(s.starts_at)} — ${dt(s.ends_at)}</div></div>`).join(''):'<div class="empty">Истории нет</div>'}`,referrals:()=>`<h3>Приглашённые</h3>${d.referrals.length?d.referrals.map(r=>`<button class="row clickable" data-open-user="${r.user.id}"><span><b>${esc(r.user.name||r.user.username||r.user.telegram_id)}</b><br><span class="muted">${esc(r.user.username?'@'+r.user.username:r.user.telegram_id)}</span></span></button>`).join(''):'<div class="empty">Приглашённых нет</div>'}`,connections:()=>`<h3>Подключения</h3>${d.connections.length?d.connections.map(c=>`<div class="item"><b>${c.active?'Активно':'Отключено'}</b><div class="muted">ID ${esc(c.telegram_connection_id)}<br>Подключено: ${dt(c.connected_at)}<br>Последняя активность: ${dt(c.last_activity_at)}</div></div>`).join(''):'<div class="empty">Подключений нет</div>'}`,active:()=>`<h3>Активные подключения</h3>${d.connections.filter(c=>c.active).length?d.connections.filter(c=>c.active).map(c=>`<div class="item"><b>Активно</b><div class="muted">ID ${esc(c.telegram_connection_id)} · ${dt(c.last_activity_at)}</div></div>`).join(''):'<div class="empty">Активных подключений нет</div>'}`,timeline:()=>`<h3>Последние события</h3>${d.timeline.length?d.timeline.map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="muted">${dt(x.at)}</div></div>`).join(''):'<div class="empty">Событий нет</div>'}`,dialogs:()=>`<h3>Диалоги и сообщения</h3><p>Диалогов: <b>${m.dialogs}</b><br>Сообщений: <b>${m.messages}</b><br>Изменено: <b>${m.edited}</b><br>Удалено: <b>${m.deleted}</b></p><a class="button link" href="/admin/dialogs-media.html?user_id=${u.id}">Открыть архив пользователя</a>`,media:()=>`<h3>Медиа</h3><p>Всего: <b>${m.media}</b><br>Защищённых: <b>${m.protected_media}</b></p><a class="button link" href="/admin/dialogs-media.html?user_id=${u.id}&media=1">Открыть медиа пользователя</a>`};const target=document.getElementById('detail');target.innerHTML=rows[kind]?.()||'';target.scrollIntoView({behavior:'smooth',block:'start'});target.querySelectorAll('[data-open-user]').forEach(node=>node.onclick=()=>load(Number(node.dataset.openUser)))}async function load(id){purgeLegacy();E.profile.innerHTML='<div class="card empty">Загрузка карточки…</div>';try{const d=await api('/api/admin/user360/users/'+id),u=d.user,m=d.metrics;let inviter;if(u.referrer_user_id){try{const rd=await api('/api/admin/user360/users/'+u.referrer_user_id),ru=rd.user;inviter=`<button class="row clickable" id="openReferrer"><span>Пригласил: <b>${esc(ru.username?'@'+ru.username:(ru.name||ru.telegram_id))}</b></span></button>`;setTimeout(()=>{const button=document.getElementById('openReferrer');if(button)button.onclick=()=>load(ru.id)},0)}catch(_){inviter='<div class="row"><span>Источник</span><b>По приглашению</b></div><div class="technical">Карточка пригласившего недоступна</div>'}}else if(u.subscription_status==='referral'){inviter='<div class="row"><span>Источник</span><b>По приглашению</b></div><div class="technical">В старой записи не сохранён ID пригласившего</div>'}else{inviter='<div class="row"><span>Источник</span><b>Прямое подключение</b></div>'}const cards=[['Диалоги',m.dialogs,'dialogs'],['Сообщения',m.messages,'dialogs'],['Изменено',m.edited,'dialogs'],['Удалено',m.deleted,'dialogs'],['Медиа',m.media,'media'],['Защищённые медиа',m.protected_media,'media'],['Оплаты',m.payments,'payments'],['Оплачено всего',money(m.paid_total),'payments'],['Средний чек',money(m.average_check),'payments'],['Приглашено',m.referrals,'referrals'],['Подключения',m.business_connections,'connections'],['Активные подключения',m.active_business,'active']];E.profile.innerHTML=`<section class="card"><h2>${esc(u.name||u.username||u.telegram_id)}</h2><div class="muted">${esc(u.username?'@'+u.username:'без username')} · Telegram ${esc(u.telegram_id)}</div><div style="margin-top:12px">${inviter}</div><div class="grid" style="margin-top:12px">${cards.map(([label,value,kind])=>`<button class="metric" data-detail="${kind}"><small>${esc(label)}</small><b>${esc(value)}</b></button>`).join('')}</div><button class="row clickable" data-detail="timeline"><span>Последние события</span></button></section><section class="card"><h3>Доступ</h3><button class="row clickable" data-detail="subscriptions"><span>Статус: <b>${esc(statusLabel(u.subscription_status))}</b></span></button><button class="row clickable" data-detail="subscriptions"><span>Trial до: <b>${dt(u.trial_ends_at)}</b></span></button><button class="row clickable" data-detail="subscriptions"><span>VIP до: <b>${dt(u.vip_ends_at)}</b></span></button><div class="stack" style="margin-top:12px"><input class="input" id="days" type="number" value="7"><button class="button" id="grant">Выдать / продлить VIP</button><button class="input danger" id="block">Заблокировать доступ</button><button class="input" id="unblock">Разблокировать доступ</button></div><div id="actionMsg"></div></section><section class="card" id="detail"><div class="empty">Нажмите на показатель, чтобы открыть подробности</div></section>`;E.profile.querySelectorAll('[data-detail]').forEach(node=>node.onclick=()=>detail(node.dataset.detail,d));const action=async fn=>{const box=document.getElementById('actionMsg');try{await fn();box.innerHTML='<p class="ok">Готово</p>';await load(id)}catch(error){box.innerHTML='<p class="error">'+esc(error.message)+'</p>'}};document.getElementById('grant').onclick=()=>action(()=>api('/api/admin/user360/users/'+id+'/grant',{method:'POST',body:JSON.stringify({days:Number(document.getElementById('days').value),kind:'vip'})}));document.getElementById('block').onclick=()=>action(()=>api('/api/admin/growth/users/'+id+'/access',{method:'PATCH',body:JSON.stringify({disabled:true,reason:'Mobile User360'})}));document.getElementById('unblock').onclick=()=>action(()=>api('/api/admin/growth/users/'+id+'/access',{method:'PATCH',body:JSON.stringify({disabled:false,reason:'Mobile User360'})}))}catch(error){E.profile.innerHTML='';fail(error)}finally{purgeLegacy()}}E.search.onclick=search;E.q.onkeydown=event=>{if(event.key==='Enter')search()};const initial=new URLSearchParams(location.search).get('user_id');if(initial)load(Number(initial));</script></body></html>
