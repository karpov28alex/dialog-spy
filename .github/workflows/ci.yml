name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      SECRET_KEY: test-secret-key-that-is-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dialog_spy_test
      REDIS_URL: redis://localhost:6379/0
      TELEGRAM_BOT_TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
      TELEGRAM_WEBHOOK_SECRET: test-webhook-secret
      ADMIN_PASSWORD: test-admin-password
      MEDIA_ROOT: /tmp/dialog-spy-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff maintained code
        run: >-
          ruff check
          app/version.py
          app/observability
          app/modules
          app/worker
          scripts/check_migrations.py
          scripts/release_smoke.py
          tests/test_security_release_contract.py
      - name: Mypy baseline
        run: mypy app/version.py
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Validate Alembic chain
        run: python scripts/check_migrations.py
      - name: Import production application
        run: python -c "from app.main import app; print(app.title)"
      - name: Test suite
        run: pytest -q
